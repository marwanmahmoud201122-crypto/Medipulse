<style>
:root{--navy:#102a43;--navy2:#243b53;--teal:#1BB7B0;--teal-d:#12908a;--blue:#3478ae;--bg:#f4f8fa;--card:#fff;--line:#e3ebf0;--mut:#627d98;--red:#c0392b;--amber:#b7791f;--green:#1f8a5b;--r:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",Arial,sans-serif;line-height:1.5;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:17px;line-height:1.1}
.brand span{display:block;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;align-items:center}
.ib{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:12px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;position:relative;text-decoration:none}
.ib:hover{background:rgba(255,255,255,.22)}
.ib.sos{background:var(--red)}
.dot{position:absolute;top:7px;inset-inline-end:8px;width:9px;height:9px;border-radius:50%;background:#ff6b5e;border:2px solid var(--navy)}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:6px 0 2px}
h2{font-size:17px;margin:0}
p{margin:4px 0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-d);font-weight:700}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:700px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.metric{border-inline-start:4px solid var(--teal);padding:14px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);border-inline-start:4px solid var(--teal)}
.metric.b{border-inline-start-color:var(--blue)}
.metric .l{font-size:13px;color:var(--mut)}
.metric .v{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.metric .v small{font-size:14px;font-weight:500;color:var(--mut);margin-inline-start:4px}
.metric .f{font-size:12px;color:var(--mut)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:#e8eef2;color:var(--navy2);font-weight:600;white-space:nowrap}
.pill.ok{background:#dff5ea;color:var(--green)}.pill.bad{background:#fde8e5;color:var(--red)}.pill.warn{background:#fdf1d9;color:var(--amber)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--teal);color:#fff;min-height:44px}
.btn:hover{background:var(--teal-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:#e8eef2;color:var(--navy)}
.btn.danger{background:#fde8e5;color:var(--red)}
.btn.link{background:none;color:var(--teal-d);padding:4px 0;min-height:0}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
label.f{display:block;font-size:13px;color:var(--mut);margin-top:10px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid #cbd6dd;border-radius:10px;background:#fff;color:var(--navy);font-size:15px}
label.f input:disabled{background:#f0f4f6}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.rec{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px}
.rec:hover{border-color:var(--teal)}
.rec .m{flex:1;min-width:0}.rec .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .m small{color:var(--mut)}
.rec .vals{font-variant-numeric:tabular-nums;font-weight:700;text-align:end;font-size:14px}
.rec .vals small{color:var(--mut);font-weight:500}
.empty{text-align:center;color:var(--mut);padding:22px 10px}
.empty b{display:block;color:var(--navy)}
.note{display:flex;gap:8px;background:#eef6fa;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--navy2);margin-top:10px}
.note.warn{background:#fdf1d9}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:13px}
.seg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--mut)}
nav.bn{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bn button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 2px;min-height:48px;border-radius:12px}
nav.bn button.on{color:var(--teal-d);font-weight:700}
nav.bn svg{width:22px;height:22px}
.toast{position:fixed;bottom:92px;inset-inline:16px;margin:auto;max-width:420px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;z-index:60;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.mb{position:fixed;inset:0;background:rgba(16,42,67,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mb{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{border-radius:20px}}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0;font-size:14px}
dt{color:var(--mut)}dd{margin:0;font-weight:600;word-break:break-word}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.tg input{width:22px;height:22px;accent-color:var(--teal)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:14px}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal);flex:none}
.chk small{display:block;color:var(--mut)}
.nrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.nrow.un b{color:var(--navy)}.nrow.rd{opacity:.65}
#map{height:260px;border-radius:12px;margin-top:10px}
.login-ok{font-size:12px;color:var(--mut);text-align:center;margin:18px 0 0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media print{.hdr,nav.bn,.btn{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

 ranges:{hrMin:null,hrMax:null,spoMin:null},checkups:[],notifications:[],devices:[]});
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);const b=blank();return{...b,...d,profile:{...b.profile,...(d.profile||{})},ranges:{...b.ranges,...(d.ranges||{})}}}}catch(e){}return mem||blank()}
let S=blank();try{S.lang=localStorage.getItem("medipulse:lang")||"en"}catch(e){}
let ME=null,AUTH="loading",auth=null,db=null,fbReady=false,unsubLinks=null,ptm=null;
function persist(){if(!ME)return;clearTimeout(ptm);ptm=setTimeout(saveCloud,350)}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(36).slice(2,10));

const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k]||k;
const loc=()=>S.lang;
const fmtDT=d=>new Intl.DateTimeFormat(loc(),{dateStyle:"medium",timeStyle:"short"}).format(new Date(d));
const fmtD=d=>new Intl.DateTimeFormat(loc(),{dateStyle:"medium"}).format(new Date(d));
const fmtShort=d=>new Intl.DateTimeFormat(loc(),{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(d));
const telClean=s=>String(s||"").replace(/[^\d+]/g,"");
const sorted=()=>[...S.checkups].sort((a,b)=>new Date(b.at)-new Date(a.at));
const latestDone=()=>sorted().find(c=>c.status==="completed"&&(c.hr!=null||c.spo2!=null));

function interpret(c){
 if(c.status!=="completed"||c.quality==="poor"||c.quality==="inconclusive")return"inconclusive";
 const r=S.ranges;if(r.hrMin==null&&r.hrMax==null&&r.spoMin==null)return null;
 let ok=true;
 if(c.hr!=null){if(r.hrMin!=null&&c.hr<r.hrMin)ok=false;if(r.hrMax!=null&&c.hr>r.hrMax)ok=false}
 if(c.spo2!=null&&r.spoMin!=null&&c.spo2<r.spoMin)ok=false;
 return ok?"within":"outside";
}
const interpLabel=i=>i==="within"?t("within"):i==="outside"?t("outside"):i==="inconclusive"?t("inconcl"):t("noInterp");
const interpPill=i=>i==="within"?"ok":i==="outside"?"warn":"";
const rangesText=()=>{const r=S.ranges;if(r.hrMin==null&&r.hrMax==null&&r.spoMin==null)return t("rangesNone");
 return t("rangesSet").replace("{a}",r.hrMin??"—").replace("{b}",r.hrMax??"—").replace("{c}",r.spoMin??"—")};
const qLabel=q=>q==="good"?t("good"):q==="poor"?t("poor"):q==="inconclusive"?t("inconc"):t("qNone");

function addNote(type,key){
 if(type==="security"?!S.profile.sec:!S.profile.notif)return;
 S.notifications.unshift({id:uid(),type,key,at:new Date().toISOString(),read:false});
 S.notifications=S.notifications.slice(0,200);
}
function toast(m){const e=document.getElementById("toast");e.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>e.innerHTML="",2800)}

/* ================= UI state ================= */
const ui={authMode:"in",links:[],pat:{},patUid:null,signup:null,alert:null,section:"home",period:7,q:"",from:"",to:"",st:"all",sel:null,confirm:null,kind:"hospital",fac:{pos:null,list:[],msg:"",loading:false}};

const CRIT={hrLow:40,hrHigh:150,spo2Low:90};
function isCritical(c){return c.status==="completed"&&c.quality!=="poor"&&c.quality!=="inconclusive"&&((c.hr!=null&&(c.hr<CRIT.hrLow||c.hr>CRIT.hrHigh))||(c.spo2!=null&&c.spo2<CRIT.spo2Low))}
let alertTimer=null;
function stopAlert(){clearInterval(alertTimer);alertTimer=null;ui.alert=null}
function dialEmergency(){location.href="tel:"+(telClean(S.profile.emerg)||"123")}
function triggerCritical(c){
 if(!isCritical(c))return;
 ui.alert={id:c.id,left:10};clearInterval(alertTimer);
 if(S.profile.autoCall){alertTimer=setInterval(()=>{
  if(!ui.alert)return stopAlert();
  ui.alert.left--;
  if(ui.alert.left<=0){stopAlert();render();dialEmergency()}
  else{const e=document.getElementById("cd");if(e)e.textContent=ui.alert.left}
 },1000)}
}

function navD(){const it=[["patients","users","patients"],["dprofile","user","profile"]];const cur=ui.section==="patient"?"patients":ui.section;
 return`<nav class="bn" aria-label="Menu">${it.map(([id,ic,k])=>`<button data-a="go" data-v="${id}" class="${cur===id?"on":""}">${I(ic)}<span>${esc(t(k))}</span></button>`).join("")}</nav>`}
function authMsg(e){const c=e&&e.code||"";
 return t(c==="auth/email-already-in-use"?"eInUse":["auth/invalid-credential","auth/wrong-password","auth/user-not-found"].includes(c)?"eBad":c==="auth/weak-password"?"eWeak":c==="auth/invalid-email"?"eEmail":c==="auth/network-request-failed"?"eNet":c==="auth/too-many-requests"?"eMany":"eGen")}

 return`<main style="max-width:440px"><div class="row sb" style="margin-top:10px"><div class="brand" style="color:var(--navy)">${LOGO}<div><b>MediPulse</b><span style="color:var(--mut)">${esc(t("tag"))}</span></div></div><button class="btn sec sm" data-a="lang" data-v="${nxt}">${lbl}</button></div>

async function saveCloud(){
 if(!ME||!db)return;
 try{const cl=o=>JSON.parse(JSON.stringify(o));const nm=S.profile.name||ME.name||"";const b=db.batch();
  b.set(db.collection("users").doc(ME.uid),cl({role:ME.role,code:ME.code||null,name:nm,profile:S.profile,notifications:S.notifications,devices:S.devices}));
  if(ME.role==="patient")b.set(db.collection("records").doc(ME.uid),cl({name:nm,ranges:S.ranges,checkups:S.checkups}));
  await b.commit()}catch(e){toast(t("syncErr"))}}
async function makeCode(uid){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 for(let i=0;i<8;i++){let c="";crypto.getRandomValues(new Uint8Array(6)).forEach(x=>c+=A[x%A.length]);
  try{await db.collection("codes").doc(c).set({uid});return c}catch(e){}}
 throw new Error("code")}

/* ---- chart (inline SVG, no libraries) ---- */
function chart(points,color,label,unit){
 const W=600,H=190,L=38,R=12,Tp=14,B=30;
 const xs=points.map(p=>new Date(p.at).getTime());const ys=points.map(p=>p.v);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=2;y1+=2}
 const pad=(y1-y0)*.15;y0-=pad;y1+=pad;
 const X=v=>L+(x1===x0?(W-L-R)/2:(v-x0)/(x1-x0)*(W-L-R));const Y=v=>Tp+(1-(v-y0)/(y1-y0))*(H-Tp-B);
 const path=points.map((p,i)=>(i?"L":"M")+X(new Date(p.at).getTime()).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
 const ticks=[0,.5,1].map(f=>y0+(y1-y0)*f);
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
 ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e3ebf0"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${Math.round(v)}</text>`).join("")}
 <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
 ${points.map(p=>`<circle cx="${X(new Date(p.at).getTime())}" cy="${Y(p.v)}" r="4" fill="${color}"><title>${esc(fmtShort(p.at))}: ${p.v}${esc(unit)}</title></circle>`).join("")}
 <text x="${L}" y="${H-8}" text-anchor="start">${esc(fmtShort(x0))}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${esc(fmtShort(x1))}</text></svg>`;
}

 const recs=src.filter(c=>c.status==="completed"&&new Date(c.at).getTime()>=cut).sort((a,b)=>new Date(a.at)-new Date(b.at));
 const hrP=recs.filter(c=>c.hr!=null).map(c=>({at:c.at,v:c.hr}));const spP=recs.filter(c=>c.spo2!=null).map(c=>({at:c.at,v:c.spo2}));
 const opts=[[3,"d3"],[7,"d7"],[30,"d30"],[365,"d365"],[0,"all"]];
 return`<section class="card"><div class="row sb"><div><span class="eyebrow">${esc(t("trend"))}</span><h2>${esc(t("trend"))}</h2></div>${I("pulse")}</div>
 <div class="seg" role="group">${opts.map(([v,k])=>`<button data-a="period" data-v="${v}" class="${per===v?"on":""}" aria-pressed="${per===v}">${esc(t(k))}</button>`).join("")}</div>

}

function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 if(AUTH!=="in"){document.getElementById("app").innerHTML=authView();document.getElementById("modal").innerHTML="";return}

 document.getElementById("app").innerHTML=header()+`<main>${v}</main>`+nav();

/* ================= actions ================= */
function download(name,mime,data){const b=new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const csvCell=v=>{let s=String(v==null?"":v);if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
function validatePayload(o){
 if(!o||typeof o!=="object")return"JSON";
 if(typeof o.checkupId!=="string"||!o.checkupId||o.checkupId.length>64)return"checkupId";
 if(typeof o.deviceId!=="string"||!o.deviceId||o.deviceId.length>96)return"deviceId";
 const hr=o.heartRateBpm,sp=o.spo2Percent;
 if(hr!=null&&!(Number.isInteger(hr)&&hr>=20&&hr<=250))return"heartRateBpm";
 if(sp!=null&&!(Number.isInteger(sp)&&sp>=50&&sp<=100))return"spo2Percent";
 if(isNaN(Date.parse(o.measuredAt)))return"measuredAt";
 if(!["good","poor","inconclusive"].includes(o.quality))return"quality";
 if(!["completed","failed"].includes(o.completionStatus))return"completionStatus";
 if(o.completionStatus==="completed"&&hr==null&&sp==null)return"completionStatus";
 return null;
}
function importPayload(txt){
 let o;try{o=JSON.parse(txt)}catch(e){return toast(t("badPayload")+"JSON")}
 const bad=validatePayload(o);if(bad)return toast(t("badPayload")+bad);
 if(!S.profile.consentAt)return toast(t("needConsent"));
 if(S.checkups.some(c=>c.checkupId===o.checkupId&&c.source==="device"))return toast(t("dup"));
 S.checkups.push({id:uid(),checkupId:o.checkupId,hr:o.heartRateBpm??null,spo2:o.spo2Percent??null,at:new Date(o.measuredAt).toISOString(),quality:o.quality,status:o.completionStatus,source:"device",deviceId:o.deviceId});
 let d=S.devices.find(x=>x.deviceId===o.deviceId);if(!d){d={deviceId:o.deviceId,name:o.deviceId,status:"disconnected"};S.devices.push(d)}
 addNote("checkup_complete",o.completionStatus==="completed"?"nDevice":"nFailed");persist();toast(t("imported"));triggerCritical(S.checkups[S.checkups.length-1]);render();
}
function restore(file){
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==1||!Array.isArray(d.checkups)||!d.profile)throw 0;
  const b=blank();S={...b,...d,profile:{...b.profile,...d.profile},ranges:{...b.ranges,...(d.ranges||{})},notifications:d.notifications||[],devices:d.devices||[]};
  S.checkups=S.checkups.filter(c=>c&&typeof c.id==="string"&&typeof c.checkupId==="string"&&!isNaN(Date.parse(c.at)));
  persist();toast(t("restored"));render()}catch(e){toast(t("badBackup"))}};r.readAsText(file);
}

/* ---- nearby (OpenStreetMap + Leaflet, loaded only when needed) ---- */
let leafletP=null,map=null,layer=null;
function loadLeaflet(){
 if(window.L)return Promise.resolve();if(leafletP)return leafletP;
 leafletP=new Promise((res,rej)=>{
  const css=document.createElement("link");css.rel="stylesheet";css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(css);
  const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";s.onload=()=>res();s.onerror=()=>{leafletP=null;rej()};document.head.appendChild(s)});
 return leafletP;
}
function drawMap(){
 const f=ui.fac;const el=document.getElementById("map");if(!el||!f.pos){map=null;return}
 loadLeaflet().then(()=>{
  const el2=document.getElementById("map");if(!el2)return;
  if(map){map.remove();map=null}
  map=L.map(el2).setView([f.pos.lat,f.pos.lng],13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  L.circleMarker([f.pos.lat,f.pos.lng],{radius:7,color:"#102a43"}).addTo(map);
  f.list.forEach(p=>L.marker([p.lat,p.lng]).addTo(map).bindPopup(esc(p.name)));
  if(f.list.length){map.fitBounds(L.latLngBounds([[f.pos.lat,f.pos.lng],...f.list.map(p=>[p.lat,p.lng])]),{padding:[30,30]})}
 }).catch(()=>{});
}
const hav=(a,b,c,d)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function searchNearby(){
 const f=ui.fac;f.msg="";f.list=[];
 if(!window.isSecureContext){f.msg=t("locSecure");return render()}
 if(!navigator.geolocation){f.msg=t("locFail");return render()}
 f.loading=true;render();
 let pos;
 try{pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:12000,maximumAge:60000}))}
 catch(e){f.loading=false;f.msg=e&&e.code===1?t("locDenied"):t("locFail");return render()}
 f.pos={lat:pos.coords.latitude,lng:pos.coords.longitude};
 const am=ui.kind==="hospital"?"hospital":"pharmacy";
 const q=`[out:json][timeout:20];(node["amenity"="${am}"](around:5000,${f.pos.lat},${f.pos.lng});way["amenity"="${am}"](around:5000,${f.pos.lat},${f.pos.lng}););out center 40;`;
 try{
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
  if(!r.ok)throw 0;const j=await r.json();
  f.list=(j.elements||[]).map(e=>{const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;if(lat==null||lng==null)return null;const g=e.tags||{};
   return{name:g.name||g["name:"+S.lang]||g["name:en"]||(ui.kind==="hospital"?t("hosp"):t("pharm")),addr:[g["addr:street"],g["addr:housenumber"],g["addr:city"]].filter(Boolean).join(" "),phone:g.phone||g["contact:phone"]||"",lat,lng,km:hav(f.pos.lat,f.pos.lng,lat,lng)}}).filter(Boolean).sort((a,b)=>a.km-b.km).slice(0,25);
  if(!f.list.length)f.msg=t("noPlaces");
 }catch(e){f.msg=navigator.onLine?t("searchFail"):t("offline")}
 f.loading=false;render();
}

/* ================= events ================= */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a,v=el.dataset.v;
 if(a==="closeBg"){if(e.target===el&&!ui.confirm){ui.sel=null;render()}return}
 switch(a){
  case"go":ui.section=v;ui.sel=null;ui.confirm=null;render();window.scrollTo(0,0);break;
  case"lang":S.lang=v;try{localStorage.setItem("medipulse:lang",v)}catch(_){}persist();render();break;
  case"period":ui.period=Number(v);render();break;
  case"open":ui.sel=v;ui.confirm=null;render();break;
  case"close":ui.sel=null;ui.confirm=null;render();break;
  case"askDel":ui.confirm="one";render();break;
  case"doDel":S.checkups=S.checkups.filter(c=>c.id!==ui.sel);ui.sel=null;ui.confirm=null;persist();toast(t("deleted"));render();break;
  case"delall":ui.confirm="all";render();break;
  case"doDelAll":try{localStorage.removeItem(KEY)}catch(_){}{const l=S.lang;S=blank();S.lang=l}mem=null;ui.confirm=null;ui.sel=null;persist();toast(t("delAllDone"));render();break;
  case"consent":S.profile.consentAt=new Date().toISOString();persist();toast(t("consentGiven"));render();break;
  case"read":{const n=S.notifications.find(x=>x.id===v);if(n)n.read=true;persist();render();break}
  case"readall":S.notifications.forEach(n=>n.read=true);persist();render();break;
  case"csv":{const h=["checkupId","measuredAt","heartRateBpm","spo2Percent","quality","status","source","deviceId"];
   const rows=sorted().map(c=>[c.checkupId,c.at,c.hr,c.spo2,c.quality||"",c.status,c.source,c.deviceId||""].map(csvCell).join(","));
   download("medipulse-records.csv","text/csv;charset=utf-8","﻿"+[h.join(",")].concat(rows).join("\r\n"));addNote("security","nExport");persist();toast(t("exported"));break}
  case"json":download("medipulse-backup.json","application/json",JSON.stringify(S,null,2));addNote("security","nExport");persist();toast(t("exported"));break;
  case"import":importPayload(document.getElementById("imp").value);break;
  case"kind":ui.kind=v;ui.fac={pos:ui.fac.pos,list:[],msg:"",loading:false};if(ui.fac.pos)searchNearby();else render();break;
  case"locate":searchNearby();break;
  case"callNow":stopAlert();dialEmergency();render();break;
  case"dismissAlert":stopAlert();render();break;
  case"logout":doLogout();break;
  case"authmode":ui.authMode=v;render();break;
  case"forgot":doForgot();break;
  case"openPat":ui.patUid=v;ui.section="patient";render();window.scrollTo(0,0);loadPat(v,true);break;
  case"backPat":ui.section="patients";ui.patUid=null;render();break;
  case"refPat":loadPat(ui.patUid,true);break;
  case"copycode":if(navigator.clipboard)navigator.clipboard.writeText(ME.code).then(()=>toast(t("codeCopied"))).catch(()=>{});break;
  case"approve":db.collection("links").doc(v).update({status:"active"}).then(()=>toast(t("approved"))).catch(()=>toast(t("syncErr")));break;
  case"decline":case"unlink":case"docunlink":if(a!=="decline"&&!confirm(t("unlinkQ")))break;db.collection("links").doc(v).delete().then(()=>{if(a==="docunlink"&&ui.section==="patient"){ui.section="patients";ui.patUid=null}toast(t("done"));render()}).catch(()=>toast(t("syncErr")));break;
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.sel||ui.confirm)){ui.sel=null;ui.confirm=null;render()}});
document.addEventListener("input",e=>{
 const id=e.target.id;if(id==="q"){ui.q=e.target.value;render()}
});
document.addEventListener("change",e=>{
 const id=e.target.id;
 if(id==="from"){ui.from=e.target.value;render()}else if(id==="to"){ui.to=e.target.value;render()}else if(id==="st"){ui.st=e.target.value;render()}
 else if(id==="rs"&&e.target.files[0]){restore(e.target.files[0]);e.target.value=""}
});
document.addEventListener("submit",e=>{
 e.preventDefault();const f=e.target;
 if(f.id==="mf"){
  const hr=Number(f.hr.value),sp=Number(f.spo2.value),at=f.at.value?new Date(f.at.value):new Date();
  if(!S.profile.consentAt)return toast(t("needConsent"));
  if(!(Number.isInteger(hr)&&hr>=20&&hr<=250&&Number.isInteger(sp)&&sp>=50&&sp<=100)||isNaN(at)||at.getTime()>Date.now()+6e4)return toast(t("badVals"));
  S.checkups.push({id:uid(),checkupId:"manual-"+uid().slice(0,8),hr,spo2:sp,at:at.toISOString(),quality:f.q.value||null,status:"completed",source:"manual",deviceId:null});
  addNote("checkup_complete","nSaved");persist();toast(t("savedM"));triggerCritical(S.checkups[S.checkups.length-1]);render();
 }else if(f.id==="af"){doAuth(f)}else if(f.id==="lf"){doLink(f)}else if(f.id==="dpf"){S.profile.name=f.elements.name.value.trim();persist();toast(t("profSaved"));render()}else if(f.id==="pf"){
  const g=n=>f.elements[n].value.trim(),num=n=>{const v=f.elements[n].value.trim();return v===""?null:Number(v)};
  const hrMin=num("hrMin"),hrMax=num("hrMax"),spoMin=num("spoMin");
  const okN=(v,a,b)=>v==null||(Number.isFinite(v)&&v>=a&&v<=b);
  if(!okN(hrMin,20,250)||!okN(hrMax,20,250)||!okN(spoMin,50,100)||(hrMin!=null&&hrMax!=null&&hrMin>hrMax))return toast(t("badVals"));
  const wasSec=JSON.stringify([S.profile.cName,S.profile.cPhone]);
  Object.assign(S.profile,{name:g("name"),email:g("email"),dob:g("dob"),phone:g("phone"),cName:g("cName"),cRel:g("cRel"),cPhone:g("cPhone"),emerg:g("emerg")||"123",
   notif:document.getElementById("notif").checked,autoCall:document.getElementById("autoCall").checked,sec:document.getElementById("sec").checked});
  const c=f.elements.consent.checked;if(c&&!S.profile.consentAt)S.profile.consentAt=new Date().toISOString();if(!c)S.profile.consentAt=null;
  S.ranges={hrMin,hrMax,spoMin};persist();toast(t("profSaved"));render();
 }
});
